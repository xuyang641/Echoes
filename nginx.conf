server {
    listen 80;
    server_name localhost; # 替换为你的国内备案域名 (Replace with your registered domain)

    # 静态文件根目录 (The output directory of 'npm run build')
    root /usr/share/nginx/html;
    index index.html;

    # 开启 Gzip 压缩，提升国内网络环境加载速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # 处理单页应用 (SPA) 路由，所有未匹配路径均指向 index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # 针对 index.html 不缓存，确保用户始终获取最新版本
        if ($request_filename ~* ^.*?\.(html|htm)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 针对静态资源开启长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API 代理 (如果需要反向代理国内的其他服务，可取消注释)
    # location /api/ {
    #     proxy_pass https://api.your-domestic-service.com/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 错误页面处理
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
